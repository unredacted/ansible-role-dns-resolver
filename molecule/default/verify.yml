---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check that systemd manages services in the test container
      ansible.builtin.assert:
        that:
          - ansible_facts['service_mgr'] == 'systemd'
          - ansible_facts['distribution_release'] == 'trixie'
        quiet: true

    - name: Read the service users
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: [hickory, encrypted-dns]

    - name: Run the binaries
      ansible.builtin.command: "/usr/local/sbin/{{ item }} --version"
      loop: [hickory-dns, encrypted-dns]
      register: dns_resolver_verify_versions
      changed_when: false

    # The expected versions come from the build inputs, so a version bump
    # only needs to change build/versions.yml.
    - name: Check the binary versions
      ansible.builtin.assert:
        that:
          - dns_resolver_build.hickory.version in dns_resolver_verify_versions.results[0].stdout
          - dns_resolver_build.encrypted_dns.version in dns_resolver_verify_versions.results[1].stdout
        quiet: true
      vars:
        dns_resolver_build: >-
          {{ lookup('ansible.builtin.file',
                    lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/build/versions.yml')
             | from_yaml }}

    - name: Read the policy files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/systemd/journald@dnsresolver.conf
        - /etc/systemd/coredump.conf.d/dns-resolver.conf
        - /etc/sysctl.d/60-dns-resolver.conf
        - /etc/nftables.d/dns-resolver.nft
      register: dns_resolver_verify_files

    - name: Check the policy files
      ansible.builtin.assert:
        that:
          - "'Storage=volatile' in (dns_resolver_verify_files.results[0].content | b64decode)"
          - "'Storage=none' in (dns_resolver_verify_files.results[1].content | b64decode)"
          - "'net.ipv6.ip_nonlocal_bind = 1' in (dns_resolver_verify_files.results[2].content | b64decode)"
          - "'Mode: pilot' in (dns_resolver_verify_files.results[3].content | b64decode)"
        quiet: true

    - name: Read the firewall unit state
      ansible.builtin.systemd_service:
        name: dns-resolver-firewall.service
      register: dns_resolver_verify_fw_unit

    - name: Check that the firewall loads at boot
      ansible.builtin.assert:
        that:
          - dns_resolver_verify_fw_unit.status.UnitFileState == 'enabled'
        quiet: true

    - name: List the live table
      ansible.builtin.command: nft -j list table inet dns_resolver
      register: dns_resolver_verify_table
      changed_when: false

    - name: Check the live table
      ansible.builtin.assert:
        that:
          - "'pilot4' in dns_resolver_verify_table.stdout"
          - "'\"service\"' in dns_resolver_verify_table.stdout"
          - "'meter6' in dns_resolver_verify_table.stdout"
        quiet: true

    - name: Read Debian's nftables drop-in
      ansible.builtin.stat:
        path: /etc/systemd/system/nftables.service.d/dns-resolver.conf
      register: dns_resolver_verify_dropin

    - name: Check that Debian's nftables unit no longer flushes on stop
      ansible.builtin.assert:
        that:
          - dns_resolver_verify_dropin.stat.exists
        quiet: true
