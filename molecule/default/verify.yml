---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check that systemd manages services in the test container
      ansible.builtin.assert:
        that:
          - ansible_facts['service_mgr'] == 'systemd'
          - ansible_facts['distribution_release'] == 'trixie'
        quiet: true

    - name: Read the service users
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: [hickory, encrypted-dns]

    - name: Run the binaries
      ansible.builtin.command: "/usr/local/sbin/{{ item }} --version"
      loop: [hickory-dns, encrypted-dns]
      register: dns_resolver_verify_versions
      changed_when: false

    - name: Check the binary versions
      ansible.builtin.assert:
        that:
          - "'0.26.3' in dns_resolver_verify_versions.results[0].stdout"
          - "'0.9.22' in dns_resolver_verify_versions.results[1].stdout"
        quiet: true

    - name: Read the policy files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/systemd/journald@dnsresolver.conf
        - /etc/systemd/coredump.conf.d/dns-resolver.conf
        - /etc/sysctl.d/60-dns-resolver.conf
        - /etc/nftables.d/dns-resolver.nft
      register: dns_resolver_verify_files

    - name: Check the policy files
      ansible.builtin.assert:
        that:
          - "'Storage=volatile' in (dns_resolver_verify_files.results[0].content | b64decode)"
          - "'Storage=none' in (dns_resolver_verify_files.results[1].content | b64decode)"
          - "'net.ipv6.ip_nonlocal_bind = 1' in (dns_resolver_verify_files.results[2].content | b64decode)"
          - "'Mode: pilot' in (dns_resolver_verify_files.results[3].content | b64decode)"
        quiet: true

    - name: Read the firewall unit state
      ansible.builtin.systemd_service:
        name: dns-resolver-firewall.service
      register: dns_resolver_verify_fw_unit

    - name: Check that the firewall loads at boot
      ansible.builtin.assert:
        that:
          - dns_resolver_verify_fw_unit.status.UnitFileState == 'enabled'
        quiet: true

    - name: List the live table
      ansible.builtin.command: nft -j list table inet dns_resolver
      register: dns_resolver_verify_table
      changed_when: false

    - name: Check the live table
      ansible.builtin.assert:
        that:
          - "'pilot4' in dns_resolver_verify_table.stdout"
          - "'\"service\"' in dns_resolver_verify_table.stdout"
          - "'meter6' in dns_resolver_verify_table.stdout"
        quiet: true

    - name: Read Debian's nftables drop-in
      ansible.builtin.stat:
        path: /etc/systemd/system/nftables.service.d/dns-resolver.conf
      register: dns_resolver_verify_dropin

    - name: Check that Debian's nftables unit no longer flushes on stop
      ansible.builtin.assert:
        that:
          - dns_resolver_verify_dropin.stat.exists
        quiet: true

- name: Verify the DNS service
  hosts: all
  gather_facts: false
  vars:
    resolver_v4: 192.0.2.53
    resolver_v6: 2001:db8::53
    hostnames: [dns1.example.net, dns2.example.net]
    ca: /root/testca/ca.pem
    in_client: ip netns exec client
  tasks:
    - name: Copy the DoH helper
      ansible.builtin.copy:
        src: doh_query.py
        dest: /root/doh_query.py
        mode: "0644"

    # --- Transports, for each host name and both address families -----------

    - name: DoT answers for each name and family
      ansible.builtin.command: >-
        {{ in_client }} kdig @{{ item.1 }} -p 853 +tls +tls-ca={{ ca }} +tls-hostname={{ item.0 }}
        +timeout=5 +retry=1 +dnssec ietf.org A
      loop: "{{ hostnames | product([resolver_v4, resolver_v6]) | list }}"
      register: dot
      changed_when: false
      failed_when: >-
        dot.rc != 0 or 'status: NOERROR' not in dot.stdout

    - name: DoQ answers for each name and family
      ansible.builtin.command: >-
        {{ in_client }} kdig @{{ item.1 }} -p 853 +quic +tls-ca={{ ca }} +tls-hostname={{ item.0 }}
        +timeout=5 +retry=1 ietf.org A
      loop: "{{ hostnames | product([resolver_v4, resolver_v6]) | list }}"
      register: doq
      changed_when: false
      failed_when: >-
        doq.rc != 0 or 'status: NOERROR' not in doq.stdout

    - name: DoH POST answers over HTTP/2 for each name and family
      ansible.builtin.command: >-
        {{ in_client }} python3 /root/doh_query.py {{ item.0 }} {{ item.1 }} ietf.org POST {{ ca }}
      loop: "{{ hostnames | product([resolver_v4, resolver_v6]) | list }}"
      register: doh_post
      changed_when: false
      failed_when: >-
        (doh_post.stdout | from_json).http_code != '200'
        or (doh_post.stdout | from_json).http_version != '2'
        or (doh_post.stdout | from_json).rcode != 0
        or (doh_post.stdout | from_json).answers < 1
        or not (doh_post.stdout | from_json).ad

    - name: DoH GET is refused (Hickory 0.26 answers POST only)
      ansible.builtin.command: >-
        {{ in_client }} python3 /root/doh_query.py {{ hostnames[0] }} {{ resolver_v4 }} ietf.org GET {{ ca }}
      register: doh_get
      changed_when: false
      failed_when: (doh_get.stdout | from_json).http_code == '200'

    # --- Post-quantum key exchange -------------------------------------------

    - name: A post-quantum client gets X25519MLKEM768 over DoT and DoH
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ in_client }} openssl s_client {{ item.flags }} -connect {{ resolver_v4 }}:{{ item.port }}
        -servername {{ hostnames[0] }} -CAfile {{ ca }} -groups X25519MLKEM768:X25519 </dev/null 2>&1
        | grep -E 'Negotiated TLS1.3 group|Verify return code'
      args:
        executable: /bin/bash
      loop:
        - { name: DoT, port: 853, flags: "-alpn dot" }
        - { name: DoH, port: 443, flags: "-alpn h2" }
      loop_control:
        label: "{{ item.name }}"
      register: pq
      changed_when: false
      failed_when: >-
        'Negotiated TLS1.3 group: X25519MLKEM768' not in pq.stdout
        or 'Verify return code: 0 (ok)' not in pq.stdout

    # openssl does not print the group for QUIC. The ServerHello size shows it:
    # an X25519MLKEM768 key share alone is 1120 bytes (ML-KEM-768 ciphertext
    # plus an X25519 share), while a plain X25519 ServerHello is about 90.
    - name: A post-quantum client gets X25519MLKEM768 over DoQ
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ in_client }} openssl s_client -quic -alpn doq -connect {{ resolver_v4 }}:853
        -servername {{ hostnames[0] }} -CAfile {{ ca }} -groups X25519MLKEM768:X25519 -msg </dev/null 2>&1
        | grep -E 'ServerHello|Verify return code'
      args:
        executable: /bin/bash
      register: pq_quic
      changed_when: false
      failed_when: >-
        'Verify return code: 0 (ok)' not in pq_quic.stdout
        or (pq_quic.stdout | regex_search('length ([0-9a-f]+)[^,]*, ServerHello', '\\1') | first | int(base=16)) < 1120

    # For a classic exchange openssl prints "Peer Temp Key" instead of a
    # "Negotiated TLS1.3 group" line.
    - name: A classic client still connects with X25519
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ in_client }} openssl s_client -alpn dot -connect {{ resolver_v4 }}:853
        -servername {{ hostnames[0] }} -CAfile {{ ca }} -groups X25519 </dev/null 2>&1
        | grep -E 'Negotiated TLS1.3 group|Peer Temp Key|Verify return code'
      args:
        executable: /bin/bash
      register: classic
      changed_when: false
      failed_when: >-
        'X25519' not in classic.stdout
        or 'MLKEM' in classic.stdout
        or 'Verify return code: 0 (ok)' not in classic.stdout

    # --- DNSSEC ---------------------------------------------------------------

    - name: Look up DNSSEC test names over DoT
      ansible.builtin.command: >-
        {{ in_client }} kdig @{{ resolver_v4 }} -p 853 +tls +tls-ca={{ ca }}
        +tls-hostname={{ hostnames[0] }} +timeout=8 +retry=1 {{ item.flags }} {{ item.name }} A
      loop:
        - { id: signed_do, name: ietf.org, flags: "+dnssec" }
        # kdig sets the AD bit in queries by default; +noadflag sends a plain
        # query (DO=0, AD=0), which must get an answer without AD.
        - { id: signed_plain, name: ietf.org, flags: "+noadflag" }
        - { id: signed_adflag, name: ietf.org, flags: "+adflag" }
        - { id: bogus, name: dnssec-failed.org, flags: "+dnssec" }
        - { id: bogus_cd, name: dnssec-failed.org, flags: "+dnssec +cdflag" }
        - { id: bogus_after_cd, name: dnssec-failed.org, flags: "+dnssec" }
      loop_control:
        label: "{{ item.id }}"
      register: dnssec
      changed_when: false

    - name: Check the DNSSEC results
      ansible.builtin.assert:
        that:
          - "'status: NOERROR' in r.signed_do and r.signed_do is search('Flags: [^;]* ad[ ;]')"
          - "'status: NOERROR' in r.signed_plain and not (r.signed_plain is search('Flags: [^;]* ad[ ;]'))"
          - "'status: NOERROR' in r.signed_adflag and r.signed_adflag is search('Flags: [^;]* ad[ ;]')"
          - "'status: SERVFAIL' in r.bogus"
          - "'status: SERVFAIL' in r.bogus_after_cd"
        quiet: true
      vars:
        r: "{{ dict(dnssec.results | map(attribute='item.id') | zip(dnssec.results | map(attribute='stdout'))) }}"

    # --- Exposure and pilot mode ---------------------------------------------

    - name: The plain DNS port is not reachable from outside
      ansible.builtin.command: >-
        {{ in_client }} kdig @{{ resolver_v4 }} -p 5300 +timeout=2 +retry=0 ietf.org A
      register: plain
      changed_when: false
      failed_when: plain.rc == 0 and 'status:' in plain.stdout

    - name: A source not on the pilot list gets no answer
      ansible.builtin.command: >-
        {{ in_client }} kdig -b {{ item.src }} @{{ item.dst }} -p 853 +tls +tls-ca={{ ca }}
        +tls-hostname={{ hostnames[0] }} +timeout=2 +retry=0 ietf.org A
      loop:
        - { src: 203.0.113.5, dst: "{{ resolver_v4 }}" }
        - { src: "2001:db8:2::5", dst: "{{ resolver_v6 }}" }
      register: unlisted
      changed_when: false
      failed_when: unlisted.rc == 0 and 'status:' in unlisted.stdout

    # --- Privacy ----------------------------------------------------------------

    - name: Make Hickory hit error paths with a known name and client address
      ansible.builtin.shell: >-
        set -o pipefail;
        {{ in_client }} kdig @{{ resolver_v4 }} -p 853 +tls +tls-ca={{ ca }} +tls-hostname={{ hostnames[0] }}
        +timeout=5 +retry=0 privacy-canary.dnssec-failed.org A;
        printf 'GET / HTTP/1.1\r\nHost: x\r\n\r\n' | {{ in_client }} timeout 3 bash -c 'cat > /dev/tcp/{{ resolver_v4 }}/443';
        {{ in_client }} timeout 3 openssl s_client -connect {{ resolver_v4 }}:443 -alpn nope </dev/null;
        true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Write a canary into the DNS journal namespace
      ansible.builtin.command: >-
        systemd-run --wait --collect -p LogNamespace=dnsresolver
        /bin/echo dns-resolver-namespace-canary
      changed_when: false

    - name: Read the DNS journal namespace
      ansible.builtin.command: journalctl --namespace=dnsresolver --no-pager -o cat
      register: ns_journal
      changed_when: false

    - name: Check that the namespace works and holds no query data
      ansible.builtin.assert:
        that:
          - "'dns-resolver-namespace-canary' in ns_journal.stdout"
          - "'privacy-canary' not in ns_journal.stdout"
          - "'198.51.100.10' not in ns_journal.stdout"
        quiet: true

    - name: Read Hickory's metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9153/metrics
        return_content: true
      register: metrics

    - name: Check that the metrics hold no query data
      ansible.builtin.assert:
        that:
          - "'privacy-canary' not in metrics.content"
          - "'198.51.100.10' not in metrics.content"
          - "'ietf' not in metrics.content"
        quiet: true

    - name: Read Hickory's unit settings
      ansible.builtin.systemd_service:
        name: hickory-dns.service
      register: unit_props

    - name: Check that swap and core dumps are off for Hickory
      ansible.builtin.assert:
        that:
          - unit_props.status.MemorySwapMax == '0'
          - unit_props.status.LimitCORE == '0'
          - unit_props.status.ActiveState == 'active'
        quiet: true

    - name: Crash Hickory on purpose
      ansible.builtin.command: systemctl kill -s SEGV hickory-dns.service
      changed_when: true

    - name: Wait for Hickory to come back
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 853
        delay: 3
        timeout: 60

    - name: Look for core dumps
      ansible.builtin.find:
        paths: [/var/lib/systemd/coredump, /var/lib/hickory, /]
        patterns: ["core*"]
        file_type: file
      register: cores

    - name: Check that no core dump was written
      ansible.builtin.assert:
        that:
          - cores.files | length == 0
        quiet: true

    - name: Score Hickory's sandbox
      ansible.builtin.command: systemd-analyze security --no-pager hickory-dns.service
      register: sandbox
      changed_when: false
      failed_when: false

    - name: Check the sandbox score
      ansible.builtin.assert:
        that:
          - >-
            (sandbox.stdout | regex_search('Overall exposure level for [^ ]+ ([0-9.]+)', '\\1') | first | float) <= 2.0
        fail_msg: "{{ sandbox.stdout_lines | select('search', 'Overall') | list }}"
        quiet: true

- name: Verify DNSCrypt
  hosts: all
  gather_facts: false
  vars:
    resolver_v4: 192.0.2.53
    resolver_v6: 2001:db8::53
    provider: 2.dnscrypt-cert.dns1.example.net
    in_client: ip netns exec client
  tasks:
    - name: Copy the certificate helper
      ansible.builtin.copy:
        src: dnscrypt_certs.py
        dest: /root/dnscrypt_certs.py
        mode: "0644"

    - name: Fetch the DNSCrypt certificates on both families
      ansible.builtin.command: "{{ in_client }} python3 /root/dnscrypt_certs.py {{ item }} 8443 {{ provider }}"
      loop: ["{{ resolver_v4 }}", "{{ resolver_v6 }}"]
      register: certs
      changed_when: false

    - name: Check that classic and post-quantum certificates are offered
      ansible.builtin.assert:
        that:
          - 2 in (item.stdout | from_json).versions
          - 3 in (item.stdout | from_json).versions
        quiet: true
      loop: "{{ certs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the provider public key
      ansible.builtin.slurp:
        src: /var/lib/encrypted-dns/provider.pub
      register: pub

    - name: Write a dnscrypt-proxy config pinned to our stamps
      ansible.builtin.copy:
        dest: /root/dnscrypt-proxy.toml
        mode: "0644"
        content: |
          listen_addresses = ['127.0.0.1:5353']
          server_names = ['test-v4', 'test-v6']
          ipv6_servers = true
          dnscrypt_servers = true
          doh_servers = false
          require_dnssec = true
          require_nolog = true
          require_nofilter = true
          cache = false
          # No internet in the test namespace: skip the connectivity probe.
          netprobe_timeout = 0
          ignore_system_dns = true
          [static]
            [static.'test-v4']
            stamp = '{{ 'dnscrypt' | dns_resolver_stamp(resolver_v4, 8443, provider_pubkey=pubkey, provider_name=provider) }}'
            [static.'test-v6']
            stamp = '{{ 'dnscrypt' | dns_resolver_stamp(resolver_v6, 8443, provider_pubkey=pubkey, provider_name=provider) }}'
      vars:
        pubkey: "{{ pub.content | b64decode | trim }}"

    - name: Resolve through dnscrypt-proxy (UDP and TCP to the server)
      ansible.builtin.shell: |
        set -o pipefail
        {{ in_client }} dnscrypt-proxy -config /root/dnscrypt-proxy.toml > /root/dnscrypt-proxy.log 2>&1 &
        proxy=$!
        sleep 5
        rc=0
        for transport in "" "+tcp"; do
          {{ in_client }} kdig @127.0.0.1 -p 5353 $transport +timeout=5 +retry=2 ietf.org A | grep -q 'status: NOERROR' || rc=1
        done
        kill $proxy
        exit $rc
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read encrypted-dns's metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9154/metrics
        return_content: true
      register: edns_metrics

    - name: Check that encrypted-dns's metrics hold no query data
      ansible.builtin.assert:
        that:
          - "'ietf' not in edns_metrics.content"
          - "'198.51.100.10' not in edns_metrics.content"
        quiet: true

    - name: Read the DNSCrypt state mode
      ansible.builtin.stat:
        path: /var/lib/encrypted-dns/encrypted-dns.state
      register: state

    - name: Check that only its owner can read the state
      ansible.builtin.assert:
        that:
          - state.stat.mode == '0600'
          - state.stat.pw_name == 'encrypted-dns'
        quiet: true

    - name: Score encrypted-dns's sandbox
      ansible.builtin.command: systemd-analyze security --no-pager encrypted-dns.service
      register: edns_sandbox
      changed_when: false
      failed_when: false

    - name: Check the sandbox score
      ansible.builtin.assert:
        that:
          - >-
            (edns_sandbox.stdout | regex_search('Overall exposure level for [^ ]+ ([0-9.]+)', '\\1') | first | float) <= 2.0
        fail_msg: "{{ edns_sandbox.stdout_lines | select('search', 'Overall') | list }}"
        quiet: true

- name: Verify metrics and stamps
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the metrics collector once
      ansible.builtin.systemd_service:
        name: dns-resolver-metrics.service
        state: started

    - name: Read the host metrics
      ansible.builtin.slurp:
        src: /var/lib/prometheus/node-exporter/dns_resolver_host.prom
      register: host_metrics

    - name: Check the host metrics
      ansible.builtin.assert:
        that:
          - "'dns_resolver_service_active{unit=\"hickory-dns.service\"} 1' in text"
          - "'dns_resolver_service_active{unit=\"encrypted-dns.service\"} 1' in text"
          - "'dns_resolver_trust_anchor_key{tag=\"38696\"} 1' in text"
          - "'dns_resolver_firewall_dropped_packets_total{rule=\"pilot\"}' in text"
          # The unlisted test sources were dropped by the pilot rule, but the
          # metrics never name them.
          - "'203.0.113.5' not in text"
          - "'198.51.100.10' not in text"
        quiet: true
      vars:
        text: "{{ host_metrics.content | b64decode }}"

    - name: Read the stamps
      ansible.builtin.slurp:
        src: /etc/dns-resolver/stamps.txt
      register: stamps

    - name: Check that every protocol has a stamp on both addresses
      ansible.builtin.assert:
        that:
          - (stamps.content | b64decode).splitlines() | select('match', '^sdns://') | list | length == 8
          - "'# DNSCrypt 2001:db8::53' in (stamps.content | b64decode)"
        quiet: true
