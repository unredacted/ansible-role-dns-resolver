---
prerun: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: dns-resolver-trixie
    image: dns-resolver-molecule:trixie
    dockerfile: Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      dns-resolver-trixie:
        dns_resolver_hostnames:
          - dns1.example.net
          - dns2.example.net
        dns_resolver_listen_v4:
          - 192.0.2.53
        dns_resolver_listen_v6:
          - 2001:db8::53
        dns_resolver_pilot_sources_v4:
          - 198.51.100.0/24
        dns_resolver_pilot_sources_v6:
          - 2001:db8:1::/48
verifier:
  name: ansible
