---
name: Build binaries

'on':
  pull_request:
    paths:
      - build/**
      - .github/workflows/build.yml
      - .github/workflows/binaries.yml
  push:
    branches:
      - main
    paths:
      - build/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/binaries.yml

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: binaries
          path: artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/hickory-dns
            artifacts/encrypted-dns

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun for the same commit reuses its release (assets are never
          # replaced) and proposes the sums that were published.
          existing=$(gh release list --limit 100 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"binaries-\") and endswith(\"-${GITHUB_SHA::7}\"))][0].tagName // empty")
          if [ -n "$existing" ]; then
            echo "Release ${existing} already exists for this commit; reusing it."
            mkdir -p published
            gh release download "$existing" -p SHA256SUMS -D published --clobber
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "sums=published/SHA256SUMS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="binaries-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          {
            echo "Binaries built from ${GITHUB_SHA}."
            echo
            echo '```'
            cat artifacts/BUILDINFO
            echo
            cat artifacts/SHA256SUMS
            echo '```'
          } > notes.md
          (cd artifacts && tar -czf sbom.tar.gz sbom)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md \
            artifacts/hickory-dns artifacts/encrypted-dns artifacts/SHA256SUMS \
            artifacts/BUILDINFO artifacts/native-inventory.md artifacts/sbom.tar.gz
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sums=artifacts/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Propose the new release in defaults/main.yml
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SUMS: ${{ steps.release.outputs.sums }}
        run: build/scripts/propose-release.sh "$TAG" "$SUMS"
