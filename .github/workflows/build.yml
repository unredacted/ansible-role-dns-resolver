---
name: Build binaries

'on':
  pull_request:
    paths:
      - build/**
      - .github/workflows/build.yml
  push:
    branches:
      - main
    paths:
      - build/**
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Upstream copy check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Entrypoint matches upstream
        run: build/checks/entrypoint-drift.sh

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build in the pinned builder image
        run: build/run.sh

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    # Only when this workflow runs on its own. When another workflow calls it
    # (for test binaries), the github context belongs to the caller.
    if: >-
      github.workflow == 'Build binaries'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: binaries
          path: artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            artifacts/hickory-dns
            artifacts/encrypted-dns

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="binaries-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          {
            echo "Binaries built from ${GITHUB_SHA}."
            echo
            echo '```'
            cat artifacts/BUILDINFO
            echo
            cat artifacts/SHA256SUMS
            echo '```'
          } > notes.md
          (cd artifacts && tar -czf sbom.tar.gz sbom)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md \
            artifacts/hickory-dns artifacts/encrypted-dns artifacts/SHA256SUMS \
            artifacts/BUILDINFO artifacts/native-inventory.md artifacts/sbom.tar.gz
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Propose the new release in defaults/main.yml
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: build/scripts/propose-release.sh "$TAG" artifacts/SHA256SUMS
