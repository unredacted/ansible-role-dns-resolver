---
name: Binaries

# Reusable: checks the upstream copy and builds both binaries, then uploads
# them as the "binaries" artifact. Used by build.yml (releases) and ci.yml
# (test binaries). Needs only read access.
'on':
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Upstream copy check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Entrypoint matches upstream
        run: build/checks/entrypoint-drift.sh

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build in the pinned builder image
        run: build/run.sh

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
