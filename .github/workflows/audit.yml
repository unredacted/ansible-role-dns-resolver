---
name: Audit released binaries

'on':
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit bin
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: |
          version=$(awk '$1 == "cargo_audit:" { print $2 }' build/versions.yml)
          cargo install --locked "cargo-audit@${version}"

      - name: Audit the newest release
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("binaries-"))][0].tagName')
          if [ -z "$tag" ]; then echo "No binary release yet."; exit 0; fi
          gh release download "$tag" -p hickory-dns -p encrypted-dns -D bin
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          set +e
          # --deny warnings: unmaintained, unsound and yanked notices also count
          # as findings, so they reach the issue.
          cargo audit bin --deny warnings bin/hickory-dns bin/encrypted-dns > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update an issue on findings
        if: steps.audit.outputs.status != '' && steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.audit.outputs.tag }}
        run: |
          title="cargo audit findings in ${TAG}"
          number=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')
          body=$(printf 'The weekly audit of release %s found advisories.\n\n```\n%s\n```\n' "$TAG" "$(cat report.txt)")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
