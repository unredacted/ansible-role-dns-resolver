---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install lint tools
        run: pip install -r requirements-ci.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: ruff
        run: ruff check .

      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; fi

      - name: Python unit tests
        run: python -m unittest discover -s tests/unit -v

  plan:
    name: Decide where test binaries come from
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Build the binaries in CI while defaults/main.yml does not pin a
      # release yet, or when this change touches the build inputs.
      - name: Check
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          build=false
          if grep -qE '^dns_resolver_hickory_url: ""' defaults/main.yml; then build=true; fi
          if [ -n "$BASE_REF" ]; then
            git fetch -q --depth=1 origin "$BASE_REF"
            if git diff --name-only FETCH_HEAD HEAD | grep -q '^build/'; then build=true; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build test binaries
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/binaries.yml

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: [lint, plan, binaries]
    if: >-
      always()
      && needs.lint.result == 'success'
      && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - firewall
          - dnscrypt
          - acme
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install test tools
        run: pip install -r requirements-ci.txt

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Download the test binaries
        if: needs.plan.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: binaries
          path: artifacts/

      - name: Use the test binaries
        if: needs.plan.outputs.build == 'true'
        run: echo "DNS_RESOLVER_ARTIFACTS=$GITHUB_WORKSPACE/artifacts" >> "$GITHUB_ENV"

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
