---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /molecule/default
    schedule:
      interval: weekly
    groups:
      test-images:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: weekly
    groups:
      builder-image:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /build/hickory-dns
    schedule:
      interval: weekly
    # hickory-dns is pinned to a commit on upstream's release/0.26 branch
    # until 0.26.4 is released. Dependabot would move it to the default
    # branch, so leave the Hickory crates alone. Remove this then.
    ignore:
      - dependency-name: 'hickory-*'
    groups:
      hickory-dns:
        patterns: ['*']
