---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /molecule/default
    schedule:
      interval: weekly
    groups:
      test-images:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ['*']
