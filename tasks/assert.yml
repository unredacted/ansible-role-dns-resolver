---
- name: Check that the host runs Debian 13 on x86_64
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] == '13'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      This role supports Debian 13 (trixie) on x86_64 only. This host runs
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      on {{ ansible_facts['architecture'] }}.
    quiet: true

- name: Check the host names
  ansible.builtin.assert:
    that:
      - dns_resolver_hostnames is sequence
      - dns_resolver_hostnames is not string
      - dns_resolver_hostnames is not mapping
      - dns_resolver_hostnames | length > 0
      - dns_resolver_hostnames | select('dns_resolver_valid_hostname') | list | length == dns_resolver_hostnames | length
    fail_msg: >-
      dns_resolver_hostnames must be a non-empty list of DNS names
      (got {{ dns_resolver_hostnames }}).
    quiet: true

- name: Check the listen addresses
  ansible.builtin.assert:
    that:
      - dns_resolver_listen_v4 is sequence and dns_resolver_listen_v4 is not string and dns_resolver_listen_v4 is not mapping
      - dns_resolver_listen_v6 is sequence and dns_resolver_listen_v6 is not string and dns_resolver_listen_v6 is not mapping
      - (dns_resolver_listen_v4 + dns_resolver_listen_v6) | length > 0
      - dns_resolver_listen_v4 | reject('dns_resolver_valid_ip', 4) | list | length == 0
      - dns_resolver_listen_v6 | reject('dns_resolver_valid_ip', 6) | list | length == 0
    fail_msg: >-
      Set at least one address in dns_resolver_listen_v4 or dns_resolver_listen_v6,
      and use plain addresses (no prefix length).
    quiet: true

- name: Check the access mode
  ansible.builtin.assert:
    that:
      - dns_resolver_access in ['pilot', 'public']
      - dns_resolver_pilot_sources_v4 is sequence and dns_resolver_pilot_sources_v4 is not string and dns_resolver_pilot_sources_v4 is not mapping
      - dns_resolver_pilot_sources_v6 is sequence and dns_resolver_pilot_sources_v6 is not string and dns_resolver_pilot_sources_v6 is not mapping
      - dns_resolver_pilot_sources_v4 | reject('dns_resolver_valid_network', 4) | list | length == 0
      - dns_resolver_pilot_sources_v6 | reject('dns_resolver_valid_network', 6) | list | length == 0
    fail_msg: >-
      dns_resolver_access must be pilot or public, and the pilot source lists
      must hold IPv4 and IPv6 addresses or networks.
    quiet: true

- name: Check the TLS source
  ansible.builtin.assert:
    that:
      - dns_resolver_tls_source in ['files']
    fail_msg: dns_resolver_tls_source must be "files".
    quiet: true

- name: Note whether the host is a container
  ansible.builtin.set_fact:
    dns_resolver_in_container: >-
      {{ ansible_facts['virtualization_role'] | default('') == 'guest'
         and ansible_facts['virtualization_type'] | default('') in ['docker', 'podman', 'container', 'containerd', 'lxc'] }}

- name: Read the active swap areas
  ansible.builtin.slurp:
    src: /proc/swaps
  register: dns_resolver_proc_swaps

# /proc/swaps lists one area per line after the header. zram lives in memory.
- name: Refuse to run with swap on disk
  ansible.builtin.assert:
    that:
      - dns_resolver_allow_disk_swap or dns_resolver_disk_swap | length == 0
    fail_msg: >-
      This host has swap on disk ({{ dns_resolver_disk_swap | join(', ') }}).
      Memory holding DNS data could be written to it. Turn that swap off, use
      zram, or set dns_resolver_allow_disk_swap to true.
    quiet: true
  vars:
    dns_resolver_disk_swap: >-
      {{ (dns_resolver_proc_swaps.content | b64decode).splitlines()[1:]
         | map('split') | map('first') | reject('match', '^/dev/zram') | list }}
