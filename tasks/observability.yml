---
- name: Create the helper directory
  ansible.builtin.file:
    path: /usr/local/libexec/dns-resolver
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make sure the node_exporter textfile directory exists
  ansible.builtin.import_tasks: textfile_dir.yml

- name: Install the metrics collector
  ansible.builtin.copy:
    src: dns-resolver-metrics.py
    dest: /usr/local/libexec/dns-resolver/dns-resolver-metrics.py
    owner: root
    group: root
    mode: "0755"

- name: Install the metrics units
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dns-resolver-metrics.service
    - dns-resolver-metrics.timer

- name: Enable the metrics timer
  ansible.builtin.systemd_service:
    name: dns-resolver-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
