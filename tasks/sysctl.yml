---
- name: Create the sysctl and module directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/sysctl.d
    - /etc/modules-load.d

- name: Write the kernel settings
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/60-dns-resolver.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply the kernel settings

- name: Load the BBR congestion control module at boot
  ansible.builtin.copy:
    content: "tcp_bbr\n"
    dest: /etc/modules-load.d/dns-resolver.conf
    owner: root
    group: root
    mode: "0644"

- name: Load the BBR module now
  community.general.modprobe:
    name: tcp_bbr
    state: present
  when: not dns_resolver_in_container
