---
- name: Read the active swap areas
  ansible.builtin.slurp:
    src: /proc/swaps
  register: dns_resolver_proc_swaps

# /proc/swaps lists one area per line after the header. zram lives in memory.
- name: Refuse to run with swap on disk
  ansible.builtin.assert:
    that:
      - dns_resolver_allow_disk_swap or dns_resolver_disk_swap | length == 0
    fail_msg: >-
      This host has swap on disk ({{ dns_resolver_disk_swap | join(', ') }}).
      Memory holding DNS data could be written to it. Turn that swap off, use
      zram, or set dns_resolver_allow_disk_swap to true.
    quiet: true
  vars:
    dns_resolver_disk_swap: >-
      {{ (dns_resolver_proc_swaps.content | b64decode).splitlines()[1:]
         | map('split') | map('first') | reject('match', '^/dev/zram') | list }}

- name: Create the systemd drop-in directories
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Turn off core dump storage
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/dns-resolver.conf
    content: |
      # Managed by ansible-role-dns-resolver. Local changes are overwritten.
      # Core dumps could contain DNS queries. Do not keep them.
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    owner: root
    group: root
    mode: "0644"

- name: Write the journal settings for the DNS services
  ansible.builtin.template:
    src: journald-namespace.conf.j2
    dest: "/etc/systemd/journald@{{ dns_resolver_journal_namespace }}.conf"
    owner: root
    group: root
    mode: "0644"
