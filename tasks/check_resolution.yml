---
# Ask Hickory over DoT on loopback, checking the certificate against the CA
# bundle and the first host name:
# 1. a signed name, which must come back NOERROR with the AD bit set, and
# 2. a random name, which must come from the authoritative servers (no cache),
#    and must not be SERVFAIL.
# Then check that the certificate is also valid for every other host name.
#
# The queries use files/dns-resolver-query.py (Python, OpenSSL) rather than
# kdig, because kdig cannot complete a TLS handshake with certificates that
# have no subject (names only in the SAN), which some ACME CAs issue.

- name: Look up a signed name over loopback DoT
  ansible.builtin.command: >-
    /usr/bin/python3 /usr/local/libexec/dns-resolver/dns-resolver-query.py
    127.0.0.1 {{ dns_resolver_dot_port }} {{ dns_resolver_post_check_signed_name }}
    --sni {{ dns_resolver_hostnames[0] }} --cafile {{ dns_resolver_tls_ca_bundle }} --dnssec
  register: dns_resolver_check_signed
  changed_when: false
  failed_when: >-
    dns_resolver_check_signed.rc != 0
    or (dns_resolver_check_signed.stdout | from_json).rcode != 'NOERROR'
    or not (dns_resolver_check_signed.stdout | from_json).ad
  retries: 3
  delay: 5
  until: dns_resolver_check_signed is not failed

- name: Look up a random name over loopback DoT
  ansible.builtin.command: >-
    /usr/bin/python3 /usr/local/libexec/dns-resolver/dns-resolver-query.py
    127.0.0.1 {{ dns_resolver_dot_port }} {{ dns_resolver_check_label }}.{{ dns_resolver_post_check_nonce_zone }}
    --sni {{ dns_resolver_hostnames[0] }} --cafile {{ dns_resolver_tls_ca_bundle }}
  vars:
    dns_resolver_check_label: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=20) }}"
  register: dns_resolver_check_nonce
  changed_when: false
  failed_when: >-
    dns_resolver_check_nonce.rc != 0
    or (dns_resolver_check_nonce.stdout | from_json).rcode not in ['NOERROR', 'NXDOMAIN']
  retries: 3
  delay: 5
  until: dns_resolver_check_nonce is not failed

- name: Check the served certificate for the other host names
  ansible.builtin.command: >-
    /usr/bin/python3 /usr/local/libexec/dns-resolver/dns-resolver-query.py
    127.0.0.1 {{ dns_resolver_dot_port }} {{ dns_resolver_post_check_signed_name }}
    --sni {{ item }} --cafile {{ dns_resolver_tls_ca_bundle }}
  loop: "{{ dns_resolver_hostnames[1:] }}"
  register: dns_resolver_check_cert
  changed_when: false
