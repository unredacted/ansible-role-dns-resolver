---
# Inputs for the binary build. Changing this file starts a new build and,
# after merge, a new release.
target: x86_64-unknown-linux-gnu

hickory:
  # Must match the hickory-dns version in build/hickory-dns/Cargo.toml.
  version: 0.26.3
  # Normally a release tag. Until 0.26.4 is released this is upstream's
  # release/0.26 branch, for DoH GET support (hickory-dns#4197). The commit
  # must be on that branch and match the rev in build/hickory-dns/Cargo.toml.
  upstream_ref: release/0.26
  upstream_commit: d896ba39149c4d26d4d1138e79023287ef46949b
  # Whether this build answers DoH GET as well as POST. Molecule checks it
  # against the binaries built from these inputs, and the release pull request
  # copies it to dns_resolver_doh_get_supported in defaults/main.yml.
  doh_get: true

encrypted_dns:
  version: 0.9.22
  # sha256 of the .crate file, from the crates.io index (cksum field).
  crate_sha256: b636e49b94a08add754b2349b7c9826f659127b4af0117e207641338ce832516

tools:
  cargo_auditable: 0.7.7
  cargo_deny: 0.21.0
  cargo_audit: 0.23.0
  cargo_cyclonedx: 0.5.10
