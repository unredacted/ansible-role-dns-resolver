---
# In a container the host owns some of these keys, so errors are only fatal on
# a real host or VM.
- name: Apply the kernel settings
  ansible.builtin.command: sysctl -e -p /etc/sysctl.d/60-dns-resolver.conf
  register: dns_resolver_sysctl_apply
  changed_when: true
  failed_when: dns_resolver_sysctl_apply.rc != 0 and not dns_resolver_in_container

- name: Restart hickory-dns
  ansible.builtin.systemd_service:
    name: hickory-dns.service
    state: restarted
    daemon_reload: true
  listen: Restart the DNS services

- name: Restart encrypted-dns
  ansible.builtin.systemd_service:
    name: encrypted-dns.service
    state: restarted
    daemon_reload: true
  listen: Restart the DNS services
  when: dns_resolver_dnscrypt_enabled
